# ============================================
# FamilyAgent 本地开发基础设施
# ============================================

services:
  # --- PostgreSQL + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fa-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-familyagent}
      POSTGRES_USER: ${DB_USER:-fa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fa_dev_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fa_user} -d ${DB_NAME:-familyagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: fa-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - ${REDIS_PASSWORD:-ASDFGZXCVB008}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-ASDFGZXCVB008}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  # --- RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fa-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fa_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fa_dev_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  # --- MinIO ---
  minio:
    image: minio/minio:latest
    container_name: fa-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

volumes:
  pg_data:
    name: fa_pg_data
  redis_data:
    name: fa_redis_data
  rabbitmq_data:
    name: fa_rabbitmq_data
  minio_data:
    name: fa_minio_data

networks:
  fa-network:
    name: fa-network
    driver: bridge
