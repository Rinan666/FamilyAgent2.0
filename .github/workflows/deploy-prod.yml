name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  backend:
    name: Java Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: familyagent_test
          POSTGRES_USER: fa_test
          POSTGRES_PASSWORD: fa_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn verify -DskipTests=false
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: familyagent_test
          DB_USER: fa_test
          DB_PASSWORD: fa_test_pass

  ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: ai-service
        run: ruff check app/

      - name: Run tests
        working-directory: ai-service
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]

    steps:
      - name: Start SSH agent
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-add ~/.ssh/deploy_key

      - name: Run production deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          ssh -o StrictHostKeyChecking=accept-new -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; \
            mkdir -p /opt; \
            if [ ! -d /opt/familyagent/.git ]; then \
              git clone git@github.com:${GITHUB_REPOSITORY}.git /opt/familyagent; \
            fi; \
            mkdir -p ~/.ssh; \
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true; \
            cd /opt/familyagent; \
            git remote set-url origin git@github.com:${GITHUB_REPOSITORY}.git; \
            git fetch origin main; \
            git checkout main; \
            git pull --ff-only origin main; \
            bash scripts/deploy-prod.sh"
