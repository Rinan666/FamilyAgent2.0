name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # Java backend checks
  # ============================================
  backend:
    name: Java Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.m.daocloud.io/pgvector/pgvector:pg16
        env:
          POSTGRES_DB: familyagent_test
          POSTGRES_USER: fa_test
          POSTGRES_PASSWORD: fa_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn verify -DskipTests=false
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: familyagent_test
          DB_USER: fa_test
          DB_PASSWORD: fa_test_pass

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ============================================
  # Python AI service checks
  # ============================================
  ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: ai-service
        run: ruff check app/

      - name: Run tests
        working-directory: ai-service
        run: python -m pytest tests/ -v --tb=short

  # ============================================
  # Frontend checks
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, ai-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt

      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install AI service dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Start infrastructure
        run: |
          STACK_ENV_FILE=deploy/examples/stack.env.example docker compose \
            --env-file deploy/examples/stack.env.example \
            -f compose.yml \
            -f deploy/compose/local.yml \
            up -d --wait --wait-timeout 120 postgres redis rabbitmq minio

      - name: Start backend
        working-directory: backend
        env:
          APP_ENV: dev
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: familyagent
          DB_USER: fa_user
          DB_PASSWORD: fa_dev_pass
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ASDFGZXCVB008
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: fa_user
          RABBITMQ_PASSWORD: fa_dev_pass
          MINIO_ENDPOINT: 127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          AI_SERVICE_URL: http://127.0.0.1:8000
          AI_INTERNAL_SERVICE_TOKEN: familyagent-dev-internal-token
        run: |
          mvn -q spring-boot:run > ../backend-e2e.log 2>&1 &
          echo $! > ../backend-e2e.pid
          timeout 180 bash -c 'until curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; do sleep 2; done'

      - name: Start deterministic AI service
        working-directory: ai-service
        env:
          APP_ENV: e2e
          APP_DEBUG: "false"
          AI_INTERNAL_SERVICE_TOKEN: familyagent-dev-internal-token
          DEFAULT_LLM_MODEL: e2e-fixture/save-plan
          FALLBACK_LLM_MODEL: e2e-fixture/save-plan
          E2E_FIXTURE_PROVIDER_ENABLED: "true"
          WEB_SEARCH_ENABLED: "false"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../ai-e2e.log 2>&1 &
          echo $! > ../ai-e2e.pid
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8000/ai/health >/dev/null; do sleep 2; done'

      - name: Start frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8080
          NEXT_PUBLIC_API_URL: /api
        run: |
          npm run dev -- --hostname 127.0.0.1 > ../frontend-e2e.log 2>&1 &
          echo $! > ../frontend-e2e.pid
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:3000/register >/dev/null; do sleep 2; done'

      - name: Run browser E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Archive E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            backend-e2e.log
            ai-e2e.log
            frontend-e2e.log
            frontend/output/playwright/

      - name: Stop E2E services
        if: always()
        run: |
          if [[ -f frontend-e2e.pid ]]; then kill "$(cat frontend-e2e.pid)" || true; fi
          if [[ -f backend-e2e.pid ]]; then kill "$(cat backend-e2e.pid)" || true; fi
          if [[ -f ai-e2e.pid ]]; then kill "$(cat ai-e2e.pid)" || true; fi
          STACK_ENV_FILE=deploy/examples/stack.env.example docker compose \
            --env-file deploy/examples/stack.env.example \
            -f compose.yml \
            -f deploy/compose/local.yml \
            down --volumes --remove-orphans
