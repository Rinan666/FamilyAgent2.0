name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ============================================
  # Java 后端检查
  # ============================================
  backend:
    name: Java Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.m.daocloud.io/pgvector/pgvector:pg16
        env:
          POSTGRES_DB: familyagent_test
          POSTGRES_USER: fa_test
          POSTGRES_PASSWORD: fa_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn verify -DskipTests=false
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: familyagent_test
          DB_USER: fa_test
          DB_PASSWORD: fa_test_pass

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ============================================
  # Python AI 服务检查
  # ============================================
  ai-service:
    name: Python AI Service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: ai-service
        run: ruff check app/

      - name: Run tests
        working-directory: ai-service
        run: python -m pytest tests/ -v --tb=short

  # ============================================
  # 前端检查
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build
