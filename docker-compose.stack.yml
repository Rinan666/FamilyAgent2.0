name: ${COMPOSE_PROJECT_NAME:-fa}

services:
  postgres:
    image: ${DOCKER_POSTGRES_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-familyagent}
      POSTGRES_USER: ${DB_USER:-fa_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fa_dev_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fa_user} -d ${DB_NAME:-familyagent}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  redis:
    image: ${DOCKER_REDIS_IMAGE:-docker.m.daocloud.io/library/redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-ASDFGZXCVB008}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-ASDFGZXCVB008}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  rabbitmq:
    image: ${DOCKER_RABBITMQ_IMAGE:-docker.m.daocloud.io/library/rabbitmq:3.13-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fa_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fa_dev_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  minio:
    image: ${DOCKER_MINIO_IMAGE:-docker.m.daocloud.io/minio/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fa-network

  ai-service:
    build:
      context: ./ai-service
      args:
        PYTHON_IMAGE: ${DOCKER_PYTHON_IMAGE:-python:3.12-slim}
        DEBIAN_MIRROR: ${DOCKER_DEBIAN_MIRROR:-}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_VERSION: ${DOCKER_PIP_VERSION:-25.1.1}
    restart: unless-stopped
    env_file:
      - ${STACK_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-false}
      AI_SERVICE_PORT: 8000
      BACKEND_URL: http://backend:8080
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ai/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - fa-network

  backend:
    build:
      context: ./backend
      args:
        MAVEN_IMAGE: ${DOCKER_MAVEN_IMAGE:-docker.m.daocloud.io/library/maven:3.9.9-eclipse-temurin-17}
        JAVA_RUNTIME_IMAGE: ${DOCKER_JAVA_RUNTIME_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jre-jammy}
    restart: unless-stopped
    env_file:
      - ${STACK_ENV_FILE:-.env}
    environment:
      APP_ENV: ${APP_ENV:-prod}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-familyagent}
      DB_USER: ${DB_USER:-fa_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ASDFGZXCVB008}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-fa_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8000
      AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - fa-network

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${DOCKER_NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        BACKEND_URL: ${DOCKER_FRONTEND_BACKEND_URL:-http://backend:8080}
        AI_SERVICE_URL: ${DOCKER_FRONTEND_AI_SERVICE_URL:-http://ai-service:8000}
    restart: unless-stopped
    env_file:
      - ${STACK_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      BACKEND_URL: ${DOCKER_FRONTEND_BACKEND_URL:-http://backend:8080}
      AI_SERVICE_URL: ${DOCKER_FRONTEND_AI_SERVICE_URL:-http://ai-service:8000}
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
      ai-service:
        condition: service_started
    networks:
      - fa-network

  cloudflared:
    image: ${DOCKER_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
      - ${CLOUDFLARED_TUNNEL_ID:?CLOUDFLARED_TUNNEL_ID is required}
    volumes:
      - type: bind
        source: ./deploy/cloudflared/config.yml
        target: /etc/cloudflared/config.yml
        read_only: true
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS_FILE:?CLOUDFLARED_CREDENTIALS_FILE is required}
        target: /etc/cloudflared/credentials.json
        read_only: true
    depends_on:
      frontend:
        condition: service_started
    networks:
      - fa-network

volumes:
  pg_data:
    name: fa_pg_data
  redis_data:
    name: fa_redis_data
  rabbitmq_data:
    name: fa_rabbitmq_data
  minio_data:
    name: fa_minio_data

networks:
  fa-network:
    name: fa-network
    driver: bridge
